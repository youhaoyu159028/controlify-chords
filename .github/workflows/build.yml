name: Build

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build mod (Minecraft 26.2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Gradle 8.14 不能运行在 JDK 25 上；Java 25 需要 Gradle 9.1+
          gradle-version: "9.5"

      - name: Build
        run: |
          set +e
          gradle --no-daemon build --console=plain --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          # 把编译错误变成 GitHub 注解，便于在 Actions 页面直接看到
          grep -E "error:|FAILURE:|What went wrong|Could not |Caused by:" build.log | head -30 | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit "$status"

      - name: Upload JAR and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controlify-chords-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/reports/**
            build.log
          if-no-files-found: warn
          retention-days: 14

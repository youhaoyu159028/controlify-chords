plugins {
    // 注意：MC 26.x 是非混淆版本，必须用 net.fabricmc.fabric-loom（不是 fabric-loom）
    id "net.fabricmc.fabric-loom" version "${loom_version}"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://api.modrinth.com/maven" }
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Controlify：只编译期依赖，不打包、不修改
    modCompileOnly "maven.modrinth:controlify:${project.controlify_version}"
    // 想在本机 runClient 调试时打开：
    // modLocalRuntime "maven.modrinth:controlify:${project.controlify_version}"

    modApi("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_version}") {
        exclude group: "net.fabricmc.fabric-api"
    }
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

def targetJava = Integer.parseInt(project.java_version)
tasks.withType(JavaCompile).configureEach {
    options.release = targetJava
    options.encoding = "UTF-8"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJava)
    withSourcesJar()
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(Jar).configureEach {
    from("LICENSE") {
        rename { fileName -> "${fileName}_${project.base.archivesName.get()}" }
    }
}
